# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - controledefechamento

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: azure-deploy-controledefechamento
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies, generate Prisma and build
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Prune devDependencies for production
        run: |
          npm prune --omit=dev

      - name: Package production release zip
        run: |
          zip -rq release.zip dist dist-server node_modules prisma package.json package-lock.json
          ls -lh release.zip

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'controledefechamento'
          slot-name: 'Production'
          package: 'release.zip'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_363E514B297F47A1ACD7ABC3AF1471A7 }}
