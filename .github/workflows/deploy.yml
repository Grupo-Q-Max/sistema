name: CI & Deploy (Grupo Q-Max)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Checagem de tipos (TypeScript)
        run: npm run typecheck

      - name: Build de produção (Vite)
        run: npm run build

      - name: Validar Configuração dos Secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          MISSING=""
          [ -z "$SSH_HOST" ] && MISSING="$MISSING SSH_HOST"
          [ -z "$SSH_USER" ] && MISSING="$MISSING SSH_USER"
          [ -z "$SSH_KEY" ] && MISSING="$MISSING SSH_PRIVATE_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Os seguintes secrets estao faltando no GitHub:$MISSING."
            exit 1
          fi

      - name: Sincronizar arquivos para o servidor (rsync via SSH)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Sincroniza arquivos construídos diretamente para o servidor sem sobrescrever .env
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'node_modules' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no" \
            ./ "$SSH_USER@$SSH_HOST:/var/www/html/grqm/sistema/"

      - name: Instalar dependências de produção e reiniciar serviços no servidor
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd /var/www/html/grqm/sistema
            echo "==> Instalando dependencias de producao..."
            npm ci --prefer-offline --no-audit
            echo "==> Gerando Prisma Client no servidor..."
            npx prisma generate
            echo "==> Verificando servicos..."
            if command -v pm2 >/dev/null 2>&1 && pm2 list | grep -qE "sistema|fechamento"; then
              pm2 reload sistema || pm2 restart sistema || pm2 restart fechamento
            elif command -v systemctl >/dev/null 2>&1 && systemctl list-unit-files | grep -q '^fechamento.service'; then
              sudo systemctl restart fechamento
            fi
            echo "==> Deploy concluido com sucesso em /var/www/html/grqm/sistema!"
          EOF
